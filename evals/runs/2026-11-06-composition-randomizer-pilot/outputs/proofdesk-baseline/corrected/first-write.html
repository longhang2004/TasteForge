<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShiftPress — proof desk</title>
<style>
@font-face{font-family:Archivo;src:url('assets/fonts/archivo/Archivo[wdth,wght].ttf') format('truetype');font-style:normal;font-weight:100 900;font-display:swap}
@font-face{font-family:Newsreader;src:url('assets/fonts/newsreader/Newsreader[opsz,wght].ttf') format('truetype');font-style:normal;font-weight:200 800;font-display:swap}
:root{--paper:#f5f3ed;--surface:#fffefa;--ink:#222820;--muted:#60665b;--line:#d4d7cb;--blue:#214fba;--pale:#eaf0ff;--green:#325b3c;--red:#a42d24;--radius:5px}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Archivo,Arial,sans-serif}button,input,select{font:inherit}button,input,select{min-height:46px}button{cursor:pointer}button:disabled{cursor:wait;opacity:.6}button,input,select{border:1px solid #939b8c;border-radius:var(--radius)}button{background:var(--surface);color:var(--ink);padding:10px 17px;font-weight:650}button:hover{background:#e9ece2}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button.primary:hover{background:#173e99}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:4px}h1:focus,h2:focus,[tabindex="-1"]:focus{outline:none}a{color:var(--blue)}h1,h2,h3,p{margin:0}h1,h2{font-family:Newsreader,Georgia,serif;font-weight:450;line-height:1.1}h1{font-size:clamp(42px,5vw,68px);letter-spacing:-1.8px}h2{font-size:34px}h3{font-size:16px}small,.small{font-size:13px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:1.6px;font-weight:700;text-transform:uppercase}.mono{font-variant-numeric:tabular-nums}.wrap{max-width:1320px;margin:auto;padding:0 48px}.topbar{border-bottom:1px solid var(--ink);background:var(--surface)}.topbar .wrap{display:flex;justify-content:space-between;align-items:center;min-height:83px;gap:20px}.brand{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:750;letter-spacing:-1px}.mark{width:33px;height:33px;position:relative;border:3px solid var(--ink);transform:rotate(-5deg);display:grid;place-items:center;font-size:20px;line-height:1}.topmeta{display:flex;gap:24px;align-items:center}.localtag{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:5px 11px;color:var(--muted)}main{padding-top:48px!important;padding-bottom:55px!important}.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;margin-bottom:35px}.intro .eyebrow{margin-bottom:13px;color:var(--blue)}.intro p{max-width:320px;color:var(--muted);padding-bottom:5px}.count{font:14px Archivo,Arial,sans-serif;letter-spacing:0;vertical-align:top;display:inline-grid;place-items:center;border:1px solid #adb4a3;border-radius:50%;width:31px;height:31px;margin:7px 0 0 10px}.queue-layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:32px}.queue-panel{min-width:0}.filters{display:flex;align-items:end;gap:14px;margin-bottom:22px}label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}.searchfield{flex:1;min-width:0}input,select{width:100%;background:var(--surface);padding:10px 12px;color:var(--ink)}input::placeholder{color:#747c6d}.filterfield{width:170px}.list-head{display:flex;justify-content:space-between;padding:0 0 10px;border-bottom:1px solid var(--ink);color:var(--muted)}.job{display:grid;grid-template-columns:128px minmax(0,1fr) auto;align-items:center;gap:20px;padding:23px 0;border-bottom:1px solid var(--line)}.job.selected{border-left:3px solid var(--blue);padding-left:13px}.job img{width:128px;height:82px;object-fit:cover;display:block}.job-code{font-size:12px;color:var(--muted);margin-bottom:4px;letter-spacing:.6px}.job h3{font-size:20px;line-height:1.35;font-weight:600;overflow-wrap:anywhere;margin-bottom:7px}.job-facts{font-size:12px;color:var(--muted)}.job-action{display:flex;flex-direction:column;align-items:flex-end;gap:12px}.status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:650;white-space:nowrap}.status:before{content:'';width:6px;height:6px;background:var(--blue);border-radius:50%}.status.approved{color:var(--green)}.status.approved:before{background:var(--green)}.job-action button{font-size:13px;min-height:39px;padding:7px 12px}.stock{border:1px solid var(--line);background:#eeeee5;padding:22px;height:fit-content}.stock .eyebrow{margin-bottom:23px}.stock-row{padding:16px 0;border-bottom:1px solid #d2d5c7}.stock-row:first-of-type{padding-top:0}.stock-name{font-size:13px}.stock-qty{font-size:28px;letter-spacing:-1px;font-weight:500}.stock-qty small{font-size:12px;color:var(--muted);letter-spacing:0;margin-left:4px}.stock p{margin-top:20px;font-size:12px;color:var(--muted)}.unavailable{color:#69705f}.queue-note{display:flex;gap:12px;margin-top:23px;color:var(--muted);font-size:12px}.queue-note span{font-size:18px;line-height:1.3}.footer{border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.footer .wrap{padding-top:19px;padding-bottom:19px;display:flex;justify-content:space-between;gap:20px}.empty{padding:45px 20px;text-align:center;border-bottom:1px solid var(--line)}.empty p{margin:10px 0 18px;color:var(--muted)}.back{border:none;background:transparent;padding:0;min-height:35px;color:var(--muted);font-size:13px;margin-bottom:24px}.back:hover{background:transparent;color:var(--blue)}.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:28px}.detail-head h1{font-size:48px;overflow-wrap:anywhere;max-width:820px}.detail-head .eyebrow{margin-bottom:10px;color:var(--muted)}.steps{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:18px 0 25px;font-size:12px;color:var(--muted)}.steps .active{color:var(--blue);font-weight:700}.steps .rule{height:1px;background:var(--line);width:35px}.desk-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:32px;align-items:start}.proof-frame{padding:40px;background:#e6e8dd;border:1px solid #d3d6c8;position:relative;min-width:0}.proof-frame:before,.proof-frame:after{content:'+';position:absolute;font-size:20px;font-weight:300;color:#858e78;top:8px;left:14px}.proof-frame:after{left:auto;right:14px;top:auto;bottom:8px}.proof-frame img{display:block;width:100%;height:auto;box-shadow:0 5px 11px #2228201c}.proof-caption{display:flex;justify-content:space-between;gap:15px;padding:15px 0;color:var(--muted);font-size:12px}.job-specs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);padding-top:17px;gap:12px}.job-specs dt{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}.job-specs dd{margin:5px 0 0;font-size:13px}.settings{background:var(--surface);border:1px solid var(--line);padding:26px}.settings h2{margin-bottom:9px}.settings .lead{color:var(--muted);font-size:13px;margin-bottom:25px}.field{margin-bottom:22px}.field small{display:block;margin-top:7px;color:var(--muted)}.field input{font-size:22px;font-variant-numeric:tabular-nums}.error{color:var(--red)!important}.field [aria-invalid="true"]{border:2px solid var(--red)}.usage{padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:23px 0}.usage-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;font-size:13px;margin-bottom:10px}.usage-row:last-child{margin-bottom:0}.usage-row.total{font-size:15px;margin-top:16px}.usage-row.total strong{font-size:28px;font-weight:550}.meter{height:5px;background:#e0e4d9;margin-top:14px}.meter-fill{height:100%;background:var(--blue);width:0}.full{width:100%}.fineprint{font-size:11px;color:var(--muted);margin-top:13px}.review-list{margin:25px 0}.review-list div{border-bottom:1px solid var(--line);padding:12px 0}.review-list dt{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px}.review-list dd{margin:0;overflow-wrap:anywhere;font-weight:600}.review-actions{display:grid;gap:10px}.notice{padding:17px;margin:20px 0;background:#fff1e8;border:1px solid #dcb2a0;font-size:13px}.notice h3{font-size:15px;margin-bottom:6px}.notice.success{background:#edf3e9;border-color:#b4c7a7;color:#294c33}.notice.pending{background:var(--pale);border-color:#bdcbed;color:#234d9d}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.skip{position:absolute;left:15px;top:-80px;padding:10px;background:white;z-index:5}.skip:focus{top:10px}
@media(max-width:1000px){.wrap{padding-left:28px;padding-right:28px}.queue-layout{grid-template-columns:minmax(0,1fr) 205px;gap:22px}.job{grid-template-columns:95px minmax(0,1fr) auto;gap:14px}.job img{width:95px;height:65px}.desk-grid{gap:22px;grid-template-columns:minmax(0,1fr) minmax(290px,1fr)}.proof-frame{padding:25px}.settings{padding:22px}}
@media(max-width:760px){.wrap{padding-left:20px;padding-right:20px}.topbar .wrap{min-height:70px}.topmeta .eyebrow{display:none}.brand{font-size:21px}.localtag{font-size:11px;padding:4px 8px}main{padding-top:30px!important}.intro{display:block;margin-bottom:28px}.intro p{margin-top:18px;max-width:100%}.queue-layout,.desk-grid{grid-template-columns:minmax(0,1fr)}.stock{margin-top:8px}.stock .eyebrow{margin-bottom:14px}.stock-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0}.stock-qty{font-size:23px}.stock p{margin-top:14px}.job{grid-template-columns:78px minmax(0,1fr);align-items:start;gap:13px}.job img{width:78px;height:65px;margin-top:3px}.job h3{font-size:19px}.job-action{grid-column:2;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;margin-top:0}.job-facts{line-height:1.7}.filters{gap:10px}.filterfield{width:128px}.filters input,.filters select{font-size:13px;padding-left:10px;padding-right:5px}.detail-head{display:block}.detail-head h1{font-size:40px}.detail-head>.status{margin-top:14px}.proof-frame{padding:27px}.settings{padding:23px}.proof-caption{font-size:11px}.steps{gap:9px;font-size:11px}.footer .wrap{display:block}.footer .wrap span{display:block;margin-top:6px}.list-head{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to proof desk</a>
<header class="topbar"><div class="wrap"><div class="brand"><span class="mark" aria-hidden="true">S</span>ShiftPress<span style="color:#8d9583;font-weight:400">/</span></div><div class="topmeta"><span class="eyebrow">Proof desk</span><span class="localtag">Local demonstration</span></div></div></header>
<main id="main" class="wrap" tabindex="-1"></main>
<footer class="footer"><div class="wrap"><span>ShiftPress — proof desk</span><span>Local approval only. No printing, charging or sending.</span></div></footer>
<div id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<script>
'use strict';
const fixture={papers:[{id:'cotton',name:'Cotton White',availableSheets:120},{id:'kraft',name:'Kraft',availableSheets:60},{id:'recycled',name:'Recycled White',availableSheets:0}],jobs:[{id:'P-104',title:'Mưa cuối phố',format:'A3 / 297 × 420 mm',ink:'Ultramarine',due:'14:00',status:'Needs proof',copies:80,paper:'cotton',asset:'proof-blue.svg'},{id:'P-105',title:'Trường sáng thứ Bảy',format:'A4 / 210 × 297 mm',ink:'Vermilion',due:'16:30',status:'Needs proof',copies:40,paper:'kraft',asset:'proof-red.svg'},{id:'P-106',title:'Đường về xưởng',format:'A3 / 297 × 420 mm',ink:'Graphite',due:'Tomorrow 09:00',status:'Approved',copies:25,paper:'cotton',asset:'proof-black.svg'}]};
const drafts=Object.fromEntries(fixture.jobs.map(j=>[j.id,{paper:j.paper,copies:String(j.copies),attempts:0,success:false}]));
let query='',filter='All',selected=null,view='queue',pending=false;
const main=document.querySelector('main');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paperFor=id=>fixture.papers.find(p=>p.id===id);
const current=()=>fixture.jobs.find(j=>j.id===selected);
const draft=()=>drafts[selected];
function validation(d){const p=paperFor(d.paper),n=Number(d.copies);return d.copies.trim()!==''&&Number.isInteger(n)&&n>=1&&n<=p.availableSheets&&p.availableSheets>0;}
function announce(message){const el=document.getElementById('announcement');el.textContent='';setTimeout(()=>{el.textContent=message;},20);}
function focusHeading(){main.querySelector('[data-heading]')?.focus();}
function status(j){return `<span class="status ${j.status==='Approved'?'approved':''}">${j.status}</span>`;}
function showQueue(focus=false){view='queue';main.innerHTML=`<div class="intro"><div><div class="eyebrow">From queue to signed-off proof</div><h1 data-heading tabindex="-1">Print queue <span class="count">03</span></h1></div><p>Check the artwork. Set the run.<br>Approve with the paper in view.</p></div><div class="queue-layout"><section class="queue-panel" aria-label="Print jobs"><div class="filters"><div class="searchfield"><label for="search">Search jobs</label><input id="search" type="search" placeholder="Job ID or title" value="${esc(query)}" autocomplete="off"></div><div class="filterfield"><label for="filter">Queue status</label><select id="filter">${['All','Needs proof','Approved'].map(s=>`<option ${s===filter?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="list-head eyebrow"><span>Job / supplied proof</span><span id="result-count"></span></div><div id="jobs"></div><p class="queue-note"><span aria-hidden="true">↳</span>Open a job to inspect its proof and review sheet consumption.</p></section><aside class="stock" aria-label="Paper availability"><h2 class="eyebrow" style="font-family:inherit;line-height:1.5">Paper on hand</h2>${fixture.papers.map(p=>`<div class="stock-row"><div class="stock-name">${p.name}</div><div class="stock-qty mono ${p.availableSheets===0?'unavailable':''}">${p.availableSheets}<small>${p.availableSheets===0?'unavailable':'sheets'}</small></div></div>`).join('')}<p>One copy, one sheet.<br>Local previews leave shared stock unchanged.</p></aside></div>`;
 document.getElementById('search').addEventListener('input',e=>{query=e.target.value;renderJobs();});document.getElementById('filter').addEventListener('change',e=>{filter=e.target.value;renderJobs();});renderJobs();if(focus){const b=main.querySelector(`[data-open="${selected}"]`);b?b.focus():focusHeading();}}
function renderJobs(){const normalized=query.trim().toLocaleLowerCase();const jobs=fixture.jobs.filter(j=>(filter==='All'||j.status===filter)&&(`${j.id} ${j.title}`).toLocaleLowerCase().includes(normalized));document.getElementById('result-count').textContent=`${jobs.length} ${jobs.length===1?'job':'jobs'}`;document.getElementById('jobs').innerHTML=jobs.length?jobs.map(j=>`<article class="job ${selected===j.id?'selected':''}"><img src="assets/${j.asset}" alt="" width="128" height="82"><div><div class="job-code mono">${j.id} · Due ${j.due}</div><h3 lang="vi">${esc(j.title)}</h3><div class="job-facts">${j.format} &nbsp;·&nbsp; ${j.ink}</div></div><div class="job-action">${status(j)}<button type="button" data-open="${j.id}" aria-label="Open ${j.id}">Open job <span aria-hidden="true">↗</span></button></div></article>`).join(''):`<div class="empty"><h3>No jobs found</h3><p>Try another title, job ID or queue status.</p><button id="clear" type="button">Clear filters</button></div>`;main.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.open;view='edit';showDetail();}));document.getElementById('clear')?.addEventListener('click',()=>{query='';filter='All';showQueue();document.getElementById('search').focus();});}
function showDetail(focus=true){const j=current(),d=draft();main.innerHTML=`<button class="back" id="back" type="button">← Back to queue</button><div class="detail-head"><div><div class="eyebrow mono">${j.id} &nbsp; / &nbsp; Due ${j.due}</div><h1 data-heading tabindex="-1" lang="vi">${esc(j.title)}</h1></div>${status(j)}</div><div class="steps" aria-label="Proof workflow"><span class="${view==='edit'?'active':''}">01 &nbsp; Inspect & adjust</span><span class="rule" aria-hidden="true"></span><span class="${view!=='edit'?'active':''}">02 &nbsp; Review & approve</span></div><div class="desk-grid"><section aria-label="Supplied proof"><div class="proof-frame"><img src="assets/${j.asset}" alt="Supplied ${j.ink} proof for ${esc(j.title)}, ${j.id}" width="600" height="360"></div><div class="proof-caption"><span>SUPPLIED PROOF · ${j.id}</span><span>Artwork preview</span></div><dl class="job-specs"><div><dt>Print format</dt><dd>${j.format}</dd></div><div><dt>Ink</dt><dd>${j.ink}</dd></div></dl></section><section class="settings" aria-label="Proof settings" id="settings"></section></div>`;document.getElementById('back').addEventListener('click',()=>showQueue(true));view==='edit'?renderEdit():renderReview();if(focus)focusHeading();}
function usageMarkup(d){const p=paperFor(d.paper),valid=validation(d),n=Number(d.copies);return `<div class="usage-row"><span>Available sheets</span><strong class="mono">${p.availableSheets}</strong></div><div class="usage-row"><span>Sheets for this run</span><strong class="mono">${valid?n:'—'}</strong></div><div class="usage-row total"><span>Remaining sheets</span><strong class="mono">${valid?p.availableSheets-n:'—'}</strong></div><div class="meter" aria-hidden="true"><div class="meter-fill" style="width:${valid?n/p.availableSheets*100:0}%"></div></div>`;}
function renderEdit(){const d=draft(),p=paperFor(d.paper);document.getElementById('settings').innerHTML=`<h2>Set the print run</h2><p class="lead">Inspect the supplied proof, then choose your paper and quantity.</p><form id="proof-form" novalidate><div class="field"><label for="paper">Paper</label><select id="paper" name="paper" aria-describedby="paper-help">${fixture.papers.map(x=>`<option value="${x.id}" ${d.paper===x.id?'selected':''} ${x.availableSheets===0?'disabled':''}>${x.name} — ${x.availableSheets===0?'unavailable':x.availableSheets+' sheets'}</option>`).join('')}</select><small id="paper-help">Recycled White is unavailable · 0 sheets.</small></div><div class="field"><label for="copies">Copies</label><input id="copies" name="copies" type="number" inputmode="numeric" min="1" max="${p.availableSheets}" step="1" value="${esc(d.copies)}" aria-describedby="copies-help copies-error"><small id="copies-help">Whole copies only. 1–<span id="copy-max">${p.availableSheets}</span> on this paper.</small><small id="copies-error" class="error" role="status"></small></div><div id="usage" class="usage" aria-live="polite" aria-atomic="true">${usageMarkup(d)}</div><button class="primary full" type="submit">Review proof <span aria-hidden="true">→</span></button><p class="fineprint">One copy consumes one sheet. Shared stock stays unchanged.</p></form>`;const copies=document.getElementById('copies');copies.addEventListener('input',()=>{d.copies=copies.value;d.success=false;updateTotals();});document.getElementById('paper').addEventListener('change',e=>{const wasValid=validation(d);d.paper=e.target.value;d.success=false;const next=paperFor(d.paper);if(wasValid&&Number(d.copies)>next.availableSheets){d.copies=String(next.availableSheets);copies.value=d.copies;announce(`Copies adjusted to ${d.copies} because ${next.name} has ${next.availableSheets} sheets available.`);}copies.max=next.availableSheets;document.getElementById('copy-max').textContent=next.availableSheets;updateTotals();});document.getElementById('proof-form').addEventListener('submit',e=>{e.preventDefault();if(!validation(d)){updateTotals();copies.focus();return;}view='review';showDetail();document.getElementById('review-heading').focus();});updateTotals();}
function updateTotals(){const d=draft(),valid=validation(d),input=document.getElementById('copies');input.setAttribute('aria-invalid',String(!valid));document.getElementById('copies-error').textContent=valid?'':`Enter a whole number from 1 to ${paperFor(d.paper).availableSheets}.`;document.getElementById('usage').innerHTML=usageMarkup(d);}
function renderReview(){const d=draft(),j=current(),p=paperFor(d.paper),valid=validation(d);document.getElementById('settings').innerHTML=`<h2 id="review-heading" tabindex="-1">${d.success?'Proof approved':'Review proof'}</h2><p class="lead">${d.success?'Your approval is recorded for this local session.':'Check the run details before recording approval.'}</p><dl class="review-list"><div><dt>Job / title</dt><dd>${j.id} · <span lang="vi">${esc(j.title)}</span></dd></div><div><dt>Paper</dt><dd>${p.name}</dd></div><div><dt>Copies / sheets consumed</dt><dd class="mono">${valid?esc(d.copies):'Invalid quantity'}</dd></div><div><dt>Remaining sheets</dt><dd class="mono">${valid?p.availableSheets-Number(d.copies):'—'}</dd></div></dl><div id="approval-message">${d.success?`<div class="notice success" role="status"><h3>Approved locally · ${j.id}</h3><p>Paper and copies are retained below. No job was printed, charged or sent.</p></div>`:''}</div><div class="review-actions"><button class="primary" id="approve" type="button" ${d.success?'hidden':''}>Approve proof</button><button id="edit" type="button">Edit proof</button></div><p class="fineprint">This demonstration records locally. Paper stock is not deducted.</p>`;document.getElementById('approve').addEventListener('click',approve);document.getElementById('edit').addEventListener('click',()=>{if(pending)return;d.success=false;view='edit';showDetail();document.getElementById('paper').focus();});}
function approve(){const d=draft(),j=current();if(pending||d.success)return;if(!validation(d)){view='edit';showDetail();document.getElementById('copies').focus();announce('Approval blocked. Enter a valid quantity.');return;}pending=true;const b=document.getElementById('approve'),edit=document.getElementById('edit');b.disabled=true;edit.disabled=true;b.textContent='Recording approval…';document.getElementById('approval-message').innerHTML='<div class="notice pending" role="status">Recording your local approval…</div>';setTimeout(()=>{pending=false;d.attempts++;b.disabled=false;edit.disabled=false;if(d.attempts===1){document.getElementById('approval-message').innerHTML='<div class="notice" role="alert" tabindex="-1" id="failure"><h3>Approval was not recorded</h3><p>The first attempt fails in this local demonstration. Your paper and copies are saved. Retry to record approval.</p></div>';b.textContent='Retry approval';document.getElementById('failure').focus();}else{d.success=true;j.status='Approved';j.copies=Number(d.copies);j.paper=d.paper;showDetail(false);document.getElementById('review-heading').focus();announce(`${j.id} approved locally. ${d.copies} copies on ${paperFor(d.paper).name}.`);}},450);}
showQueue();
</script>
</body>
</html>
